<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140d1a">
<title>¡Hooola Gabyta Bonita!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BC%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --dur: 7000ms;
    --fade: 1400ms;
    --ink: #ffffff;
    --cream: #fff3bf;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif", serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #140d1a;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: var(--serif);
    color: var(--ink);
  }

  .stage {
    position: fixed;
    inset: 0;
    background: #140d1a;
  }

  /* ---------- Diapositivas ---------- */
  .slide {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    transition: opacity var(--fade) ease-in-out;
  }
  /* La que entra se desvanece por encima de la que sale, así nunca se ve el fondo vacío */
  .slide.active  { opacity: 1; visibility: visible; z-index: 3; }
  .slide.leaving { opacity: 1; visibility: visible; z-index: 2; }

  /* Fondo: la misma imagen, desenfocada y oscurecida, para que el texto siempre se lea */
  .backdrop {
    position: absolute;
    inset: -10%;
    z-index: -1;
    background-size: cover;
    background-position: center;
    filter: blur(34px) brightness(.36) saturate(1.2);
  }

  .frame {
    position: relative;
    min-height: 0;
    margin: calc(env(safe-area-inset-top, 0px) + 40px) 5vw 0;
  }
  .frame.small {
    width: min(100%, 520px);
    margin-inline: auto;
  }

  .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 14px 34px rgba(0, 0, 0, .55));
    will-change: transform;
  }
  .slide.active .photo,
  .slide.leaving .photo {
    animation: drift 7s ease-out both;
  }
  @keyframes drift {
    from { transform: scale(1); }
    to   { transform: scale(1.045); }
  }

  /* ---------- Leyendas ---------- */
  .caption {
    position: relative;
    text-align: center;
    padding: 1.6rem 1.5rem calc(2.4rem + env(safe-area-inset-bottom, 0px));
    font-size: clamp(1.75rem, 6.4vw, 3rem);
    line-height: 1.2;
    font-style: italic;
    letter-spacing: .01em;
    color: var(--ink);
    text-shadow: 0 2px 16px rgba(0, 0, 0, .65), 0 0 2px rgba(0, 0, 0, .5);
    background: linear-gradient(to top, rgba(8, 5, 12, .82), rgba(8, 5, 12, .5) 65%, rgba(8, 5, 12, 0));
    opacity: 0;
    transition: opacity .9s ease .45s;
  }
  .slide.active .caption,
  .slide.leaving .caption { opacity: 1; }

  /* ---------- Última diapositiva ---------- */
  .slide.final {
    background:
      radial-gradient(60% 42% at 50% 38%, rgba(255, 212, 59, .22), rgba(255, 212, 59, 0) 72%),
      linear-gradient(180deg, #0f2b30 0%, #123a31 58%, #0b201c 100%);
  }
  .slide.final .frame {
    display: grid;
    place-items: center;
    margin-top: calc(env(safe-area-inset-top, 0px) + 48px);
  }
  .bouquet {
    width: min(100%, 520px);
    height: 100%;
    max-height: 100%;
    overflow: visible;
  }
  .slide.final .caption {
    background: none;
    color: var(--cream);
    text-shadow: 0 2px 14px rgba(0, 0, 0, .45);
  }

  .stem {
    fill: none;
    stroke: #4a9a5b;
    stroke-width: 4.5;
    stroke-linecap: round;
    stroke-dasharray: 1;
  }
  .leaf { fill: #3c8a50; }
  .bloom { transform-box: fill-box; transform-origin: center; }

  .slide.final.active .stem,
  .slide.final.leaving .stem {
    animation: grow 1.5s cubic-bezier(.3, .6, .3, 1) both;
    animation-delay: var(--d, 0s);
  }
  .slide.final.active .leaf,
  .slide.final.leaving .leaf {
    animation: fadeIn .8s ease both;
    animation-delay: var(--d, 0s);
  }
  .slide.final.active .bloom,
  .slide.final.leaving .bloom {
    animation: bloom 1.1s cubic-bezier(.2, .9, .3, 1.2) both;
    animation-delay: var(--d, 0s);
  }
  @keyframes grow   { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bloom  {
    from { transform: scale(0) rotate(-50deg); opacity: 0; }
    to   { transform: scale(1) rotate(0);      opacity: 1; }
  }

  .again {
    display: block;
    margin: 1.5rem auto 0;
    padding: .65rem 1.4rem;
    font: inherit;
    font-size: 1.05rem;
    font-style: normal;
    color: var(--cream);
    background: transparent;
    border: 1.5px solid rgba(255, 243, 191, .6);
    border-radius: 999px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .9s ease, background-color .2s ease;
  }
  .finished .again { opacity: 1; pointer-events: auto; transition-delay: 2.5s, 0s; }
  .again:hover { background: rgba(255, 243, 191, .12); }
  .again:focus-visible { outline: 3px solid #ffd43b; outline-offset: 3px; }

  /* ---------- Barra de progreso ---------- */
  .progress {
    position: fixed;
    z-index: 10;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: 5vw;
    right: 5vw;
    display: flex;
    gap: 6px;
  }
  .progress i {
    flex: 1;
    height: 3px;
    border-radius: 3px;
    overflow: hidden;
    background: rgba(255, 255, 255, .28);
  }
  .progress b {
    display: block;
    height: 100%;
    width: 0;
    background: #fff;
  }
  .progress i.done b { width: 100%; }
  .progress i.run b  { animation: fill var(--dur) linear forwards; }
  @keyframes fill { from { width: 0; } to { width: 100%; } }

  @media (prefers-reduced-motion: reduce) {
    .slide.active .photo, .slide.leaving .photo,
    .slide.final.active .stem, .slide.final.leaving .stem,
    .slide.final.active .leaf, .slide.final.leaving .leaf,
    .slide.final.active .bloom, .slide.final.leaving .bloom { animation: none; }
    .stem { stroke-dasharray: none; }
  }
</style>
</head>
<body>

<div class="progress" id="progress" aria-hidden="true"></div>

<main class="stage" aria-live="polite">

  <section class="slide">
    <div class="backdrop"></div>
    <div class="frame"><img class="photo" src="piedad.jpg" alt="La Piedad de Miguel Ángel"></div>
    <p class="caption">existen obras de arte</p>
  </section>

  <section class="slide">
    <div class="backdrop"></div>
    <div class="frame"><img class="photo" src="divina.jpg" alt="Portada de la Divina Comedia de Dante Alighieri"></div>
    <p class="caption">otras obras de arte</p>
  </section>

  <section class="slide">
    <div class="backdrop"></div>
    <div class="frame small"><img class="photo" src="novena.jpg" alt="Partitura de la Novena Sinfonía de Beethoven"></div>
    <p class="caption">más obras de arte</p>
  </section>

  <section class="slide">
    <div class="backdrop"></div>
    <div class="frame"><img class="photo" src="venus.jpg" alt="El nacimiento de Venus, de Botticelli"></div>
    <p class="caption">muchas obras de arte</p>
  </section>

  <section class="slide">
    <div class="backdrop"></div>
    <div class="frame"><img class="photo" src="catedral.jpg" alt="Catedral de Milán"></div>
    <p class="caption">diversas obras de arte</p>
  </section>

  <section class="slide">
    <div class="backdrop"></div>
    <div class="frame"><img class="photo" src="gabyta.jpg" alt="Gabyta"></div>
    <p class="caption">y tunas 😍🤤</p>
  </section>

  <section class="slide final">
    <div class="frame">
      <svg class="bouquet" viewBox="0 0 360 300" role="img" aria-label="Ramo de flores amarillas">
        <defs>
          <g id="flor">
            <g fill="#ffd43b" stroke="#e5a600" stroke-width="1.2">
              <ellipse cx="0" cy="-27" rx="10" ry="21"/>
              <ellipse cx="0" cy="-27" rx="10" ry="21" transform="rotate(45)"/>
              <ellipse cx="0" cy="-27" rx="10" ry="21" transform="rotate(90)"/>
              <ellipse cx="0" cy="-27" rx="10" ry="21" transform="rotate(135)"/>
              <ellipse cx="0" cy="-27" rx="10" ry="21" transform="rotate(180)"/>
              <ellipse cx="0" cy="-27" rx="10" ry="21" transform="rotate(225)"/>
              <ellipse cx="0" cy="-27" rx="10" ry="21" transform="rotate(270)"/>
              <ellipse cx="0" cy="-27" rx="10" ry="21" transform="rotate(315)"/>
            </g>
            <circle r="15" fill="#6b3f0e"/>
            <circle r="9" fill="#93591a"/>
            <circle r="3" cx="-3" cy="-3" fill="#c98a2b"/>
          </g>
        </defs>

        <!-- tallos -->
        <path class="stem" pathLength="1" style="--d:.1s" d="M180 300 C 182 240 178 180 180 118"/>
        <path class="stem" pathLength="1" style="--d:.25s" d="M175 300 C 170 240 112 222 95 166"/>
        <path class="stem" pathLength="1" style="--d:.4s" d="M185 300 C 190 240 250 216 265 160"/>
        <path class="stem" pathLength="1" style="--d:.55s" d="M172 300 C 125 292 58 262 38 228"/>
        <path class="stem" pathLength="1" style="--d:.7s" d="M188 300 C 238 292 305 262 322 228"/>

        <!-- hojas -->
        <path class="leaf" style="--d:.9s" d="M180 240 C 150 241 128 226 122 204 C 148 206 172 218 180 240Z"/>
        <path class="leaf" style="--d:1s" d="M181 214 C 210 215 232 200 238 180 C 212 182 189 194 181 214Z"/>
        <path class="leaf" style="--d:1.1s" d="M150 272 C 128 276 104 268 92 250 C 116 248 140 256 150 272Z"/>
        <path class="leaf" style="--d:1.2s" d="M212 272 C 234 276 258 268 270 250 C 246 248 222 256 212 272Z"/>

        <!-- flores -->
        <g class="bloom" style="--d:1.0s"><use href="#flor" transform="translate(180 70) scale(1.2) rotate(12)"/></g>
        <g class="bloom" style="--d:1.3s"><use href="#flor" transform="translate(95 122) scale(.92) rotate(-8)"/></g>
        <g class="bloom" style="--d:1.5s"><use href="#flor" transform="translate(265 112) scale(1) rotate(20)"/></g>
        <g class="bloom" style="--d:1.75s"><use href="#flor" transform="translate(38 200) scale(.6) rotate(5)"/></g>
        <g class="bloom" style="--d:1.95s"><use href="#flor" transform="translate(322 200) scale(.62) rotate(-15)"/></g>
      </svg>
    </div>
    <div class="caption">
      ¡Que tengas una bonita semana Beibicita!
      <button class="again" id="again" type="button">Ver otra vez</button>
    </div>
  </section>

</main>

<script>
(function () {
  var DURATION = 5000;   // cada imagen se queda 5 segundos
  var FADE = 1400;       // duración del desvanecimiento entre imágenes

  var root = document.documentElement;
  root.style.setProperty('--dur', DURATION + 'ms');
  root.style.setProperty('--fade', FADE + 'ms');

  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var last = slides.length - 1;
  var bar = document.getElementById('progress');
  var segs = slides.map(function () {
    var seg = document.createElement('i');
    seg.appendChild(document.createElement('b'));
    bar.appendChild(seg);
    return seg;
  });

  // Fondo desenfocado a partir de la propia foto (sin duplicar datos en el archivo)
  slides.forEach(function (slide) {
    var img = slide.querySelector('.photo');
    var back = slide.querySelector('.backdrop');
    if (img && back) back.style.backgroundImage = 'url("' + img.src + '")';
  });

  var current = -1;
  var timer = null;

  function show(i) {
    var prev = slides[current];
    var next = slides[i];

    if (prev && prev !== next) {
      prev.classList.remove('active');
      prev.classList.add('leaving');
      setTimeout(function () { prev.classList.remove('leaving'); }, FADE + 150);
    }
    next.classList.remove('leaving');
    next.classList.add('active');
    current = i;

    segs.forEach(function (seg, k) {
      seg.classList.toggle('done', k < i || (i === last && k === last));
      seg.classList.toggle('run', k === i && i !== last);
    });

    if (i < last) {
      timer = setTimeout(function () { show(i + 1); }, DURATION);
    } else {
      document.body.classList.add('finished');
    }
  }

  document.getElementById('again').addEventListener('click', function () {
    clearTimeout(timer);
    document.body.classList.remove('finished');
    show(0);
  });

  // Arranca cuando todas las imágenes ya están listas
  var imgs = Array.prototype.slice.call(document.querySelectorAll('.photo'));
  var ready = Promise.all(imgs.map(function (im) {
    return (im.decode ? im.decode() : Promise.resolve()).catch(function () {});
  }));
  ready.then(function () { show(0); });
})();
</script>
</body>
</html>
